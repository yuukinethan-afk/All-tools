.c h3{margin:auto 0 8px;font-size:13px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;width:100%}
.c p{display:none}
.b{position:static;font-size:8px;letter-spacing:.5px;padding:2px 7px;border-radius:999px;background:rgba(178,102,255,.18);color:var(--p);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{margin-top:0;font-size:9px;font-weight:700;letter-spacing:.6px;padding:3px 9px;border-radius:999px;background:rgba(52,211,153,.14);color:#34d399;border:1px solid rgba(52,211,153,.4)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px 0}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:28px}
/* modal */
#m{position:fixed;inset:0;background:rgba(5,0,12,.72);display:none;align-items:flex-end;justify-content:center;z-index:9}
#m.on{display:flex}
.sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#m{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh h2{margin:0;font-size:18px}
.x{border:0;background:var(--card2);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input[type=color]{height:44px;padding:3px}
input[type=range]{padding:0}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;color:#12001f;background:linear-gradient(90deg,var(--p),var(--k));font-weight:600;text-decoration:none;display:inline-block}
.btn.g{background:var(--card2);color:var(--tx);font-weight:400}
.res{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border:1px dashed var(--bd);word-break:break-all;white-space:pre-wrap;min-height:44px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font-size:18px}.stats span{font-size:11px;color:var(--mut)}
.pv{margin-top:12px;display:flex;justify-content:center}
.pv svg,.pv canvas,.pv img{max-width:100%;height:auto;border-radius:12px}
.gp{height:90px;border-radius:12px;margin-top:10px}
</style>
</head>
