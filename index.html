<style>
:root{--bg:#1a0b2e;--card:#251240;--card2:#331a57;--bd:#46296b;--tx:#fff4e8;--mut:#bba8d8;--p:#ff7ab8;--k:#ff7ab8;--e:cubic-bezier(.2,.8,.2,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background:
    radial-gradient(170vmax 170vmax at 2% 0%, rgba(255,122,184,.56), transparent 72%),
    radial-gradient(180vmax 180vmax at 100% 4%, rgba(82,184,255,.48), transparent 72%),
    radial-gradient(190vmax 190vmax at 0% 100%, rgba(61,220,151,.4), transparent 72%),
    radial-gradient(175vmax 175vmax at 100% 100%, rgba(255,154,61,.44), transparent 72%),
    radial-gradient(220vmax 220vmax at 50% 48%, rgba(123,77,255,.5), transparent 76%),
    var(--bg);
  background-repeat:no-repeat}
main{position:relative;max-width:760px;margin:0 auto;padding:22px 16px 56px;overflow-x:clip}
h1{margin:0;font-size:clamp(15px,4.8vw,23px);line-height:1.08;font-weight:800;letter-spacing:-.01em}
header{position:relative;z-index:1;margin-bottom:6px;padding:22px 0 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.digi{font:700 clamp(17px,5.4vw,25px)/1 "Cormorant Garamond",Georgia,serif;color:#ffe8b0;letter-spacing:.06em;text-shadow:0 0 10px rgba(230,201,138,.5);white-space:nowrap;text-align:right}
.digi .cl{animation:cblink 1s step-start infinite}
.digi .dt{display:block;margin-top:2px;font:600 11px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
@keyframes cblink{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.digi .cl{animation:none}}
.bar{position:relative;z-index:3;display:flex;gap:8px;margin:6px 0 12px}
.roleline{position:relative;z-index:3;display:flex;justify-content:flex-end;margin-bottom:2px}
.roletag{font:700 11px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px 5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;background:var(--card2);color:var(--mut);border:1px solid var(--bd)}
.roletag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.roletag.r-owner{color:#ffe08a;border-color:rgba(255,224,138,.5);background:rgba(255,224,138,.1)}
.roletag.r-vip{color:#ff9ad6;border-color:rgba(255,154,214,.5);background:rgba(255,154,214,.1)}
.roletag.r-visitor{color:var(--mut)}
#q{flex:1;min-width:0;padding:14px 16px;border-radius:16px;border:0;background:var(--card);color:var(--tx);font:inherit}
#q::placeholder{color:var(--mut)}
#q:focus-visible,.btn:focus-visible,#seg button:focus-visible,.x:focus-visible,#sz:focus-visible{outline:3px solid var(--tx);outline-offset:2px}
.btn{border:0;padding:11px 18px;border-radius:14px;font:inherit;font-weight:700;background:var(--p);color:#2a0a1c;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:var(--card2);color:var(--tx);font-weight:600}
.btn:active{transform:scale(.97)}
h1{color:#ffd976}
.hero .word{display:inline-flex}
.hero .ltr,.tls{display:inline-block;will-change:opacity;color:#ffe07a;
  text-shadow:0 0 6px rgba(255,217,118,.9),0 0 16px rgba(255,180,60,.75),0 0 30px rgba(255,140,40,.55);
  animation:neonPulse 2.6s ease-in-out infinite}
.hero .ltr{transition:transform .12s var(--e)}
.hero .ltr:nth-child(1){animation-delay:0s}.hero .ltr:nth-child(2){animation-delay:.1s}
.hero .ltr:nth-child(3){animation-delay:.2s}.hero .ltr:nth-child(4){animation-delay:.3s}
.hero .ltr:nth-child(5){animation-delay:.4s}.hero .ltr:nth-child(6){animation-delay:.5s}
.tls{animation-delay:.6s}
@keyframes neonPulse{0%,100%{opacity:.82}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.hero .ltr,.tls{animation:none;opacity:1}}
#seg{position:relative;z-index:3;display:flex;gap:6px;overflow-x:auto;background:transparent;border-radius:999px;padding:2px;scrollbar-width:none}
#seg::-webkit-scrollbar{display:none}
#seg .ind{display:none}
#seg button{position:relative;z-index:1;flex:none;border:1.5px solid var(--cc,var(--bd));background:color-mix(in srgb,var(--cc,var(--bd)) 14%,transparent);color:var(--cc,var(--mut));padding:9px 16px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s,transform .12s var(--e)}
#seg button:active{transform:scale(.95)}
#seg button.on{background:var(--cc,var(--tx));color:var(--cb,var(--bg));box-shadow:0 0 0 1px var(--cc,var(--tx)),0 6px 18px -6px var(--cc,var(--tx))}
#seg button small{opacity:.75;font-weight:600;margin-left:3px}
.meta{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 12px;color:var(--mut);font-size:14px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:720px){#grid{grid-template-columns:repeat(4,1fr);gap:12px}}
.c{position:relative;aspect-ratio:.72;border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,var(--card2),var(--card));color:var(--tx);cursor:pointer;overflow:hidden;user-select:none;-webkit-user-select:none;border:2px solid var(--tile);box-shadow:0 0 0 1px rgba(0,0,0,.25) inset,0 10px 22px -12px var(--tile);transition:transform .14s var(--e),box-shadow .2s}
.c:active{transform:scale(.96)}
.c:focus-visible{outline:3px solid var(--tx);outline-offset:3px}
.c::before{content:"";position:absolute;left:10px;right:10px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--tile);opacity:.9}
.c::after{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.08);border-radius:10px;pointer-events:none}
.c.im{color:#fff}
.c.im .ph{position:absolute;inset:0;background:var(--img) center/cover;opacity:.3}
.c.im .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,4,26,.1) 20%,rgba(14,4,26,.88))}
.c>*:not(.ph){position:relative}
.c .tg{align-self:flex-start;max-width:64%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;color:var(--bg);background:var(--tile)}
.c h3{margin:0;font-size:clamp(13px,4vw,17px);line-height:1.15;font-weight:800;letter-spacing:-.03em;overflow-wrap:anywhere;hyphens:auto;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.c .rb{position:absolute;top:13px;right:-30px;width:118px;text-align:center;transform:rotate(43deg);font:800 10px/1.9 "Bricolage Grotesque",sans-serif;letter-spacing:.14em;color:#2a1a00;background:linear-gradient(90deg,#ffe08a,#f0b545);box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:2}
.c .rb.ok{background:linear-gradient(90deg,#d8c08a,#8d7247);color:#2a1a00;opacity:.92}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}}
#grid.intro .c{animation:rise .5s var(--e) both;animation-delay:calc(var(--i)*38ms)}
.empty{grid-column:1/-1;text-align:center;padding:36px 8px;color:var(--mut)}
.empty p{margin:0 0 14px}
footer{margin-top:34px;color:var(--mut);font-size:13px}
#ts{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--e);z-index:20;white-space:nowrap}
#ts.on{opacity:1;transform:translate(-50%,0)}
#dim{position:fixed;inset:0;background:rgba(10,3,20,.62);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}
#dim.on{opacity:1;pointer-events:auto}
#sh{position:fixed;z-index:9;display:none;overflow:hidden;background:var(--tile,var(--card));transition:left .4s var(--e),top .4s var(--e),width .4s var(--e),height .4s var(--e),border-radius .4s var(--e),background-color .3s}
#sh.on{display:block}
#sh.nt{transition:none}
#sh.full{background:var(--card)}
#shin{height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity .18s}
#sh.full #shin{opacity:1;transition-delay:.2s}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sh h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.025em}
.x{border:0;background:var(--card2);color:var(--tx);padding:9px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;flex:none}
#mb label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
#mb input,#mb textarea,#mb select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
#mb input:focus,#mb textarea:focus,#mb select:focus{outline:2px solid var(--p);outline-offset:1px}
#mb input[type=color]{height:48px;padding:3px}
#mb input[type=range]{padding:0;accent-color:var(--p)}
#mb input[type=checkbox]{accent-color:var(--p)}
#mb textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.res{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg);border:1.5px dashed var(--bd);word-break:break-all;white-space:pre-wrap;min-height:46px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:11px;color:var(--mut)}
.pv{margin-top:12px;display:flex;justify-content:center}
.pv svg,.pv canvas,.pv img{max-width:100%;height:auto;border-radius:14px}
.gp{height:90px;border-radius:14px;margin-top:10px}

#ld{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;justify-content:flex-end;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,rgba(10,3,20,.55) 40%,var(--bg) 78%)}
.ldc{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:16px;z-index:2}
.ldc.on{display:flex}
.ldc .ring{position:relative;width:66px;height:66px}
.ldc .ring i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--tile);animation:ldspin 1s linear infinite}
.ldc .ring i:nth-child(2){inset:10px;border-top-color:transparent;border-right-color:var(--tile);opacity:.6;animation-duration:1.4s;animation-direction:reverse}
.ldc .dot{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--tile);box-shadow:0 0 12px var(--tile);animation:ldpulse 1s ease-in-out infinite}
.ldc .lbl{font-size:12.5px;color:var(--mut);letter-spacing:.03em}
@keyframes ldspin{to{transform:rotate(360deg)}}
@keyframes ldpulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(.85)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.ldc .ring i,.ldc .dot{animation:none}}
#ld.on{display:flex}
#ld .pc{font-size:13px;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
#ld .pb{height:8px;border-radius:999px;background:var(--card2);overflow:hidden}
#ld .pf{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--p),#ffd23d);transition:width .18s linear}
#ld .lg{margin-top:10px;max-height:72px;overflow:hidden;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mut)}
#ld .lg span{display:block;opacity:0;animation:lgin .25s forwards}
#ld .lg span.ok{color:#3ddc97}
@keyframes lgin{to{opacity:1}}
#mb{position:relative}

#bl{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 38%,#2a1140 0%,#140726 55%,#0a0315 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s var(--e),visibility .6s}
#bl.gone{opacity:0;visibility:hidden;pointer-events:none}
#bl .face{position:relative;width:164px;height:164px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#2e2016,#120c08 72%);box-shadow:0 0 0 2px #7a5a2e,0 0 0 7px #0a0315,inset 0 0 18px rgba(0,0,0,.6),0 0 34px rgba(201,161,94,.18)}

#bl .hr{width:4px;height:42px;margin:-42px 0 0 -2px;background:#d9b876;animation:spinH 2.6s linear infinite}
#bl .mn{width:3px;height:58px;margin:-58px 0 0 -1.5px;animation:spinM 1.3s linear infinite}
#bl .sc{width:1.4px;height:64px;margin:-64px 0 0 -.7px;background:#ff7ab8;animation:spinS 1.9s steps(60) infinite}
#bl .pin{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#e9d4a3;box-shadow:0 0 6px rgba(233,212,163,.8)}
@keyframes spinH{to{transform:rotate(360deg)}}
@keyframes spinM{to{transform:rotate(360deg)}}
@keyframes spinS{to{transform:rotate(360deg)}}
#bl .brand{font:800 26px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.06em;color:#f3eaff}
#bl .tx{font-size:12px;letter-spacing:.16em;color:#a08bc9;text-transform:uppercase}
#bl .tx b{color:#e9d4a3;font-variant-numeric:tabular-nums}

.hero{position:relative;z-index:1;display:inline-block}
.hero .cwrap{position:absolute;left:64%;top:66%;width:660%;height:660%;transform:translate(-50%,-50%) rotate(0deg);z-index:0;pointer-events:none;transition:transform .25s var(--e);filter:drop-shadow(0 0 20px rgba(230,201,138,.6));animation:clockGlow 2.6s ease-in-out infinite}
@keyframes clockGlow{0%,100%{opacity:.82}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.hero .cwrap{animation:none;opacity:.95}}
.hero .cwrap svg{width:100%;height:100%;display:block}
.hero .cnum{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;fill:#ffe8b0}
.hero .ctick{stroke:#ffe8b0;stroke-width:1.3;opacity:.75}
.hero .cring{fill:none;stroke:#ffe8b0;stroke-width:1.5;opacity:.8}
.hero .chand{stroke-linecap:round;transform-origin:150px 150px}
.hero .chand.hr{stroke:#ffe8b0;stroke-width:5.5}
.hero .chand.mn{stroke:#fff2cf;stroke-width:3.8}
.hero .chand.sc{stroke:var(--p);stroke-width:1.6}
.hero .cpin{fill:#fff2cf}
.hero .word{position:relative;cursor:pointer}
.hero.pulse .cwrap{animation:heroPulse .5s var(--e)}
@keyframes heroPulse{0%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1)}35%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.07)}100%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1)}}
@media(prefers-reduced-motion:reduce){.hero .cwrap{transition:none}.hero.pulse .cwrap{animation:none}}
@media(prefers-reduced-motion:reduce){#bl{transition:none}#bl.gone{display:none}}
.vipgate{text-align:center;padding:36px 6px 6px}
.vipgate .vi{display:inline-block;font:800 12px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.2em;color:#2a1a00;background:linear-gradient(90deg,#ffe08a,#f0b545);padding:8px 16px;border-radius:999px;margin-bottom:16px}
.vipgate p{color:var(--mut);font-size:14px;margin:0 0 16px}
.vipgate input{text-align:center;letter-spacing:.14em;font-size:16px;text-transform:uppercase}
.vipgate .er{color:#ff7a7a;font-size:13px;min-height:18px;margin-top:8px}
@media(prefers-reduced-motion:reduce){*,*::before{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}}
</style>

function finalRect(){var m=innerWidth<700,w=Math.min(innerWidth,640),h=m?innerHeight:Math.round(innerHeight*.92);return{left:(innerWidth-w)/2,top:(innerHeight-h)/2,width:w,height:h,rad:m?0:28}}
function tileRect(id){var el=document.querySelector('.c[data-id="'+id+'"]');return el?el.getBoundingClientRect():{left:innerWidth/2-30,top:innerHeight/2-30,width:60,height:60}}

var LOGS=["Menghubungkan ke tool…","Menyiapkan antarmuka…","Memuat komponen…","Hampir siap…"];
function boot(render,ms){
  var ld=$("ld"),f=$("ldf"),p=$("ldp"),g=$("ldg"),ldc=$("ldc"),t0=Date.now(),dur=ms||(700+Math.random()*500);
  $("mb").style.visibility="hidden";ld.classList.add("on");ldc.classList.add("on");g.innerHTML="";f.style.width="0%";p.textContent="0%";
  var shown=0;
  function tick(){
    var el=Date.now()-t0,pct=Math.min(100,Math.round(el/dur*100));
    f.style.width=pct+"%";p.textContent=pct+"%";
    var want=Math.floor(pct/100*LOGS.length);
    while(shown<want){var ln=document.createElement("span");ln.textContent=LOGS[shown];g.appendChild(ln);g.scrollTop=g.scrollHeight;shown++}
    if(pct<100){requestAnimationFrame(tick)}
    else{
      var ok=document.createElement("span");ok.className="ok";ok.textContent="Siap.";g.appendChild(ok);g.scrollTop=g.scrollHeight;
      ldc.classList.remove("on");
      setTimeout(function(){ld.classList.remove("on");$("mb").style.visibility="";render()},220);
    }
  }
  requestAnimationFrame(tick);
}

function openTool(id,fromHash){
  var t=T.filter(function(x){return x.id==id})[0];if(!t)return;
  if(t.u&&fromHash)return;
  buzz();$("mt").textContent=t.n;$("mb").innerHTML="";$("shin").scrollTop=0;
  sh.style.setProperty("--tile",colorFor(t).bg);
  setGeo(tileRect(id),22);sh.classList.add("nt","on");void sh.offsetWidth;sh.classList.remove("nt");
  dim.classList.add("on");document.body.style.overflow="hidden";cur=id;
  var f=finalRect();requestAnimationFrame(function(){setGeo(f,f.rad);sh.classList.add("full")});
  try{if(!fromHash)history.pushState({o:1},"","#"+id)}catch(e){}
  if(t.vip&&ROLE==="visitor")vipGate(t);else fillTool(t);
}
function fillTool(t){
  if(t.u){
    boot(function(){
      window.open(t.u,"_blank","noopener");
      $("mb").innerHTML='<div style="text-align:center;padding:50px 10px 10px">'
        +'<p style="font-size:15px;color:var(--mut);margin:0 0 16px">Tool dibuka di tab baru. Kalau belum muncul, ketuk tombol di bawah.</p>'
        +'<a class="btn" href="'+esc(t.u)+'" target="_blank" rel="noopener">Buka lagi</a></div>';
    },2200);
    return;
  }
  boot(function(){t.r($("mb"))},3000);
}
function vipGate(t){
  $("mb").innerHTML='<div class="vipgate"><div class="vi">VIP</div><p>Tool ini khusus VIP. Masukkan kunci untuk membuka '+esc(String(t.n))+'.</p>'
    +'<input id="vipc" type="text" inputmode="text" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters">'
    +'<div class="er" id="vipe"></div>'
    +'<div class="btns" style="justify-content:center"><button class="btn" id="vipok">Buka</button></div></div>';
  function tryUnlock(){
    var v=$("vipc").value.trim();if(!v)return;
    $("vipe").textContent="";$("vipok").disabled=true;$("vipok").textContent="Memeriksa…";
    fetch("/api/vip",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:v})})
      .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
      .then(function(res){
        $("vipok").disabled=false;$("vipok").textContent="Buka";
        if(res.ok){ROLE="vip";buzz();toast("Terbuka, selamat datang VIP ✨");setRoleTag();fillTool(t);list()}
        else{buzz();$("vipe").textContent=(res.j&&res.j.error)||"Kunci salah.";$("vipc").select()}
      }).catch(function(){$("vipok").disabled=false;$("vipok").textContent="Buka";$("vipe").textContent="Gagal menghubungi server."});
  }
  $("vipok").onclick=tryUnlock;
  $("vipc").onkeydown=function(e){if(e.key==="Enter")tryUnlock()};
  setTimeout(function(){try{$("vipc").focus()}catch(e){}},360);
}
function doClose(){
  if(!cur)return;var id=cur;
  sh.classList.remove("full");setGeo(tileRect(id),22);dim.classList.remove("on");document.body.style.overflow="";cur=null;
  setTimeout(function(){if(!cur){sh.classList.remove("on");$("mb").innerHTML=""}},430);
  try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}
}
function closeTool(){if(!cur)return;try{if(history.state&&history.state.o){history.back();return}}catch(e){}doClose()}
window.addEventListener("popstate",function(){if(cur)doClose()});
window.addEventListener("resize",function(){if(cur){var f=finalRect();setGeo(f,f.rad)}moveInd()});
$("mx").onclick=closeTool;dim.onclick=closeTool;
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(cur)closeTool();else if($("q").value){$("q").value="";list()}}
  else if(e.key==="/"&&!cur&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")){e.preventDefault();$("q").focus()}
});

// Status peran: Owner (login admin) > VIP (kunci aktif) > Pengunjung
var ROLE_LABEL={owner:"Owner",vip:"VIP",visitor:"Pengunjung"};
function setRoleTag(){var e=$("roleTag");if(!e)return;e.textContent=ROLE_LABEL[ROLE];e.className="roletag r-"+ROLE}
function detectRole(){
  return fetch("/api/login",{credentials:"same-origin",cache:"no-store"}).then(function(r){return r.ok?r.json():{ok:false}}).catch(function(){return{ok:false}})
  .then(function(o){ if(o&&o.ok){ROLE="owner";return} 
    return fetch("/api/vip",{credentials:"same-origin",cache:"no-store"}).then(function(r){return r.ok?r.json():{ok:false}}).catch(function(){return{ok:false}})
    .then(function(v){ROLE=(v&&v.ok)?"vip":"visitor"}) });
}

// Tools tambahan + pengaturan dari panel admin (/admin.html)
Promise.all([
  detectRole(),
  fetch("/api/tools",{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}).catch(function(){return{}})
]).then(function(res){
 var d=res[1]||{};
 var a=Array.isArray(d)?d:(d.tools||[]),ov=Array.isArray(d)?{}:(d.over||{});
 T.forEach(function(t){var o=ov[t.id];if(!o)return;if(o.n)t.n=o.n;if(o.bg)t.bg=o.bg;if(o.vip!==undefined)t.vip=!!o.vip});
 T=T.filter(function(t){return!(ov[t.id]&&ov[t.id].hide)});
 var m=a.map(function(x){var c=x.c||"Tools";if(cats.indexOf(c)<0)cats.push(c);return{id:"c-"+x.id,n:x.n,d:x.d||"",b:x.b||"LINK",c:c,u:x.u,bg:x.bg,vip:!!x.vip}});
 T.unshift.apply(T,m);setRoleTag();chips();list();
}).catch(function(){setRoleTag()});
chips();list();setRoleTag();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
if(location.hash)openTool(location.hash.slice(1),true);
</script>
