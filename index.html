 e.innerHTML='<div class="row"><div><label>Warna 1</label><input id="a" type="color" value="#b266ff"></div><div><label>Warna 2</label><input id="b" type="color" value="#ff5fa8"></div></div><label>Sudut: <span id="av">135</span>°</label><input id="g" type="range" min="0" max="360" value="135"><div class="gp" id="p"></div><div class="res" id="o"></div><div class="btns"><button class="btn" id="cp">Salin CSS</button></div>';
 function u(){var s="linear-gradient("+e.querySelector("#g").value+"deg, "+e.querySelector("#a").value+", "+e.querySelector("#b").value+")";
  e.querySelector("#av").textContent=e.querySelector("#g").value;e.querySelector("#p").style.background=s;e.querySelector("#o").textContent="background: "+s+";"}
 ["a","b","g"].forEach(function(i){e.querySelector("#"+i).oninput=u});u();
 e.querySelector("#cp").onclick=function(){copy(e.querySelector("#o").textContent,this)}}},
{id:"warna",ic:"🎨",n:"Konversi Warna",d:"HEX ke RGB dan HSL dari color picker.",b:"VISUAL",c:"Visual",r:function(e){
 e.innerHTML='<input id="a" type="color" value="#b266ff"><div class="gp" id="p"></div><div class="res" id="o"></div><div class="btns"><button class="btn" id="cp">Salin</button></div>';
 function u(){var h=e.querySelector("#a").value,r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16),R=r/255,G=g/255,B=b/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),l=(mx+mn)/2,s=0,hu=0,d=mx-mn;
  if(d){s=d/(1-Math.abs(2*l-1));hu=mx==R?((G-B)/d)%6:mx==G?(B-R)/d+2:(R-G)/d+4;hu=Math.round((hu*60+360)%360)}
  e.querySelector("#p").style.background=h;e.querySelector("#o").textContent="HEX: "+h.toUpperCase()+"\nRGB: rgb("+r+", "+g+", "+b+")\nHSL: hsl("+hu+", "+Math.round(s*100)+"%, "+Math.round(l*100)+"%)"}

var cats=["Semua","Maker","Tools","Visual"],cat="Semua",first=true,cur=null,sh=$("sh"),dim=$("dim");
var PAL=[["#7b4dff","#ffffff"],["#ff7ab8","#2a0a1c"],["#ff9a3d","#2b1200"],["#3ddc97","#032616"],["#52b8ff","#021a2e"],["#f5e050","#2a2300"]];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var fav=[];try{fav=JSON.parse(ls("nx.fav")||"[]")||[]}catch(e){fav=[]}
function isFav(id){return fav.indexOf(id)>-1}
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
var tt;function toast(m){var e=$("ts");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},1700)}
function colorFor(t){var h=0,s=String(t.id);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;var p=PAL[h%PAL.length];return{bg:p[0],ink:p[1]}}
function bgImg(t){var b=t.bg;if(!b)return"";return /^(https?:|\/|\.|data:)/.test(b)?"url('"+String(b).replace(/'/g,"%27")+"')":b}
function tile(t,i){var c=colorFor(t),f=isFav(t.id),im=bgImg(t);
 return '<article class="c'+(im?' im':'')+'" data-id="'+esc(String(t.id))+'" tabindex="0" role="button" aria-label="'+esc(String(t.n))+'" style="'+esc('--i:'+i+';--tile:'+c.bg+';--ink:'+c.ink+(im?';--img:'+im:''))+'">'
 +'<span class="tg">'+esc(String(t.b).toLowerCase())+'</span>'
 +'<button class="st'+(f?' on':'')+'" aria-label="'+(f?'Lepas sematan':'Sematkan')+'" aria-pressed="'+f+'">'+(f?'\u2605':'\u2606')+'</button>'
 +'<h3>'+esc(String(t.n))+'</h3></article>'}

function chips(){
  var n={};T.forEach(function(t){n[t.c]=(n[t.c]||0)+1});
  $("seg").innerHTML='<span class="ind"></span>'+cats.map(function(c){return '<button role="tab" data-c="'+esc(c)+'" class="'+(c==cat?'on':'')+'">'+esc(c)+'<small>'+(c=="Semua"?T.length:(n[c]||0))+'</small></button>'}).join("");
  moveInd()}
function moveInd(){var b=$("seg").querySelector("button.on"),i=$("seg").querySelector(".ind");if(!b||!i)return;
  i.style.width=b.offsetWidth+"px";i.style.transform="translateX("+b.offsetLeft+"px)";
  try{b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})}catch(e){}}
$("seg").onclick=function(e){var b=e.target.closest("button");if(!b)return;cat=b.dataset.c;
  [].forEach.call($("seg").querySelectorAll("button"),function(x){x.classList.toggle("on",x===b)});moveInd();list();buzz()};

function list(){
  var q=$("q").value.toLowerCase().trim();
  var a=T.filter(function(t){return(cat=="Semua"||t.c==cat)&&(!q||(t.n+" "+t.d+" "+t.b).toLowerCase().indexOf(q)>-1)});
  var rk=function(t){var i=fav.indexOf(t.id);return i>-1?i:9999};
  a.sort(function(x,y){return rk(x)-rk(y)});
  var g=$("grid");
  if(first&&a.length){g.classList.add("intro");first=false;setTimeout(function(){g.classList.remove("intro")},1100)}
  g.innerHTML=a.length?a.map(tile).join(""):'<div class="empty"><p>'+(q?'Tidak ada tool yang cocok dengan \u201C'+esc($("q").value.trim())+'\u201D.':'Belum ada tool di kategori ini.')+'</p><button class="btn" id="rs">Tampilkan semua</button></div>';
  $("cnt").textContent=a.length+" tool"+((q||cat!="Semua")?" ditemukan":"");
}
$("q").oninput=list;
$("grid").onclick=function(e){
  if(e.target.id==="rs"){$("q").value="";cat="Semua";chips();list();return}
  var c=e.target.closest(".c");if(!c)return;
  if(e.target.closest(".st"))togglePin(c.dataset.id);else openTool(c.dataset.id)};
$("grid").onkeydown=function(e){if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("c")){e.preventDefault();openTool(e.target.dataset.id)}};
function togglePin(id){var i=fav.indexOf(id);if(i>-1)fav.splice(i,1);else fav.unshift(id);ls("nx.fav",JSON.stringify(fav));buzz();list();
  var s=document.querySelector('.c[data-id="'+id+'"] .st');if(s)s.classList.add("pop");toast(i>-1?"Sematan dilepas":"Disematkan di atas")}
$("rn").onclick=function(){openTool(T[Math.floor(Math.random()*T.length)].id)};

var big=ls("nx.big")==="1";
function applySz(){$("grid").classList.toggle("big",big);$("sz").textContent=big?"Perkecil":"Perbesar"}
$("sz").onclick=function(){big=!big;ls("nx.big",big?"1":"0");applySz()};applySz();

/* Buka tool: kartu melebar jadi panel, tutup: menyusut balik ke kartunya */
function setGeo(r,rad){sh.style.left=r.left+"px";sh.style.top=r.top+"px";sh.style.width=r.width+"px";sh.style.height=r.height+"px";sh.style.borderRadius=rad+"px"}
function finalRect(){var m=innerWidth<700,w=Math.min(innerWidth,640),h=m?innerHeight:Math.round(innerHeight*.92);return{left:(innerWidth-w)/2,top:(innerHeight-h)/2,width:w,height:h,rad:m?0:28}}
function tileRect(id){var el=document.querySelector('.c[data-id="'+id+'"]');return el?el.getBoundingClientRect():{left:innerWidth/2-30,top:innerHeight/2-30,width:60,height:60}}
function openTool(id,fromHash){
  var t=T.filter(function(x){return x.id==id})[0];if(!t)return;
  if(t.u){if(fromHash)return;buzz();toast("Membuka "+t.n);window.open(t.u,"_blank","noopener");return}
  buzz();$("mt").textContent=t.n;$("mb").innerHTML="";t.r($("mb"));$("shin").scrollTop=0;
  sh.style.setProperty("--tile",colorFor(t).bg);
  setGeo(tileRect(id),22);sh.classList.add("nt","on");void sh.offsetWidth;sh.classList.remove("nt");
  dim.classList.add("on");document.body.style.overflow="hidden";cur=id;
  var f=finalRect();requestAnimationFrame(function(){setGeo(f,f.rad);sh.classList.add("full")});
  try{if(!fromHash)history.pushState({o:1},"","#"+id)}catch(e){}
}
function doClose(){
  if(!cur)return;var id=cur;
  sh.classList.remove("full");setGeo(tileRect(id),22);dim.classList.remove("on");document.body.style.overflow="";cur=null;
  setTimeout(function(){if(!cur){sh.classList.remove("on");$("mb").innerHTML=""}},430);
  try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}
}
function closeTool(){if(!cur)return;try{if(history.state&&history.state.o){history.back();return}}catch(e){}doClose()}
window.addEventListener("popstate",function(){if(cur)doClose()});
window.addEventListener("resize",function(){if(cur){var f=finalRect();setGeo(f,f.rad)}moveInd()});
$("mx").onclick=closeTool;dim.onclick=closeTool;
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(cur)closeTool();else if($("q").value){$("q").value="";list()}}
  else if(e.key==="/"&&!cur&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||"")){e.preventDefault();$("q").focus()}
});

// Tools tambahan + pengaturan dari panel admin (/admin.html)
fetch("/api/tools",{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}).then(function(d){
 var a=Array.isArray(d)?d:(d.tools||[]),ov=Array.isArray(d)?{}:(d.over||{});
 T.forEach(function(t){var o=ov[t.id];if(!o)return;if(o.n)t.n=o.n;if(o.bg)t.bg=o.bg});
 T=T.filter(function(t){return!(ov[t.id]&&ov[t.id].hide)});
 var m=a.map(function(x){var c=x.c||"Tools";if(cats.indexOf(c)<0)cats.push(c);return{id:"c-"+x.id,n:x.n,d:x.d||"",b:x.b||"LINK",c:c,u:x.u,bg:x.bg}});
 T.unshift.apply(T,m);chips();list()}).catch(function(){});
chips();list();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
if(location.hash)openTool(location.hash.slice(1),true);
</script>
